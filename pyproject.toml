[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cobmix"
version = "0.1.0"
description = "COMEX-style multi-view code representations for COBOL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "networkx>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
cobmix = "cobmix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
